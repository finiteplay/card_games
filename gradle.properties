org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# Nine modules on a sixteen-core machine had been building and testing one at a time.
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.caching=true
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# The release version shown in every app's Settings > About, and the git tag (v<version>).
# Each app still has its own integer versionCode, which only ever rises (Play orders builds by it).
finiteplay.versionName=0.3.0
